name: Atualizar dashboard

on:
  schedule:
    - cron: '7 */3 * * *'   # a cada 3 horas, no minuto 7 (UTC): 00h07, 03h07... de Brasília
  workflow_dispatch: {}    # botão "Atualizar agora" da página e manual

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Coletar Meta, Guru e HubSpot
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          GURU_TOKEN: ${{ secrets.GURU_TOKEN }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: ./atualizar.sh
      - name: Publicar na Vercel
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_d3lbulDpm0oan3IzFejyQUYn
          VERCEL_PROJECT_ID: prj_oJVRsADOTlVGADLubMXHWdxARSGl
        run: npx --yes vercel@59.1.4 deploy --prod --yes --token "$VERCEL_TOKEN"
