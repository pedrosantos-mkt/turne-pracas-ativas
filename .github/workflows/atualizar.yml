name: Atualizar dashboard

on:
  schedule:
    - cron: '7 0,9,12,15,18,21 * * *'   # 6h07, 9h07, 12h07, 15h07, 18h07 e 21h07 de Brasília (UTC-3); sem madrugada
  workflow_dispatch: {}    # botão "Atualizar agora" da página e manual

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # a 1ª rodada calcula todas as praças encerradas do ano; depois vêm do cache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Praças encerradas já calculadas
        uses: actions/cache@v4
        with:
          path: cache
          key: pracas-${{ github.run_id }}
          restore-keys: pracas-
      - name: Coletar Meta, Guru e HubSpot
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          GURU_TOKEN: ${{ secrets.GURU_TOKEN }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          VENDAS_PLANILHA: ${{ secrets.VENDAS_PLANILHA }}
        run: ./atualizar.sh
      - name: Publicar na Vercel
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_d3lbulDpm0oan3IzFejyQUYn
          VERCEL_PROJECT_ID: prj_oJVRsADOTlVGADLubMXHWdxARSGl
        run: npx --yes vercel@59.1.4 deploy --prod --yes --token "$VERCEL_TOKEN"
